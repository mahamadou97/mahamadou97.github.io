name: Vérifier les pages publiques de bêta-test

on:
  push:
    branches: [main]
    paths:
      - 'trouveme/**'
      - 'chromacascade/**'
      - 'autour-de-moi-confidentialite/**'
      - 'beta/**'
      - '.github/workflows/verify-beta-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Tester les contenus publiés sur GitHub Pages via HTTPS
        shell: bash
        run: |
          set -euo pipefail
          root='https://mahamadou97.github.io'
          for page in trouveme/beta chromacascade/beta; do
            url="$root/$page/"
            echo "Contrôle HTTPS public : $url"
            curl --fail --location --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "$url" -o "/tmp/${page//\//-}.html"
            grep -qi 'Bêta-test' "/tmp/${page//\//-}.html"
            grep -qi 'Demander une invitation' "/tmp/${page//\//-}.html"
            grep -qi 'contact.mt.apps@gmail.com' "/tmp/${page//\//-}.html"
            echo "OK : $page"
          done
          echo 'Les deux pages sont publiquement lisibles et ne nécessitent pas de connexion GitHub.'
